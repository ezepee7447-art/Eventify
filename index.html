<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventify-home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="home">

<header class="top-bar">
    <a href="index.html" class="brand">
    <img src="images/full-logo-img.jpeg" alt="Eventifylogo">
</a>
</header>

<main>
<section class="greeting">
<h1>Good Morning, Organizer 👋 </h1>
<p>Here's what's happening with your events.</p>
</section>

<section class="stats">
<div class="stat-card">
<p>Total Events</p>
<strong>5</strong>
</div>

<div class="stat-card">
<p>Total Attendance</p>
<strong>482</strong>
</div>
</section>

<section class="upcoming">
<h2>Upcoming Events</h2>

<article class="event-card">
<img src="images/event-img.jpeg" alt="Tech & Creators Summit 2026">

<div class="date-badge">
<strong>27</strong>
<span>Sep</span>
</div>

<div class="event-info">
<h3>Tech &amp; CreatorsSummit 2026</h3>
<p> Eko  Conventional Center, V.I, Lagos</p>
</div>
</article>
</section>

<nav class="bottom-nav">
<a href="index.html" class="nav-item active">
<i class="bi bi-house-door"></i>
<span>Home</span>
</a>

<a href="#" class="nav-item active">
<i class="bi bi-ticket-perforated-fill"></i>
<span>Events</span>
</a>

<a href="#" class="nav-item active">
<i class="bi bi-person-badge"></i>
<span>Staffs</span>
</a>

<a href="#" class="nav-item active">
<i class="bi bi-calendar-check"></i>
<span>Attendance</span>
</a>

<a href="#" class="nav-item active">
<i class="bi bi-clipboard2-data-fill"></i>
<span>Reports</span>
</a>
</nav>
</main>



<script src="js/main.js"></script>
</body>
</html>
