<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventify-Ticket Codes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <a href="createnewevent.html" class="back-link" aria-label="Go back">&#8249</a>
        <h1>Upload/Manage Ticket Codes</h1>
    </header>


    <main class="tickets-page">
        <section class="upload-box"><span class="upload-icon"><i class="bi bi-file-earmark-arrow-up"></i></span>
        <p>Upload Ticket Code here</p>
        <small>Supported CSV, TXT or XLS</small>
    </section>

    <input type="file" id="ticket-file" accept=".csv, .txt, .xls" hidden>
    <label for="ticket-file" class="btn-outline">Choose file</label>

    <h2 class="section-title">Uploaded Ticket</h2>

    <ul class="ticket-list">
        <li class="ticket-row">
            <span class="ticket-icon"><i class="bi bi-ticket-detailed"></i></span>
            <div class="ticket-info"><strong class="ticket-code">  CSV458</strong>
            <P>203 tickets . Regular</P>
        </div>
        <span class="status-pill">Active</span>
        </li>

        <li class="ticket-row">
            <span class="ticket-icon"><i class="bi bi-ticket-detailed"></i></span>
            <div class="ticket-info"><strong class="ticket-code">CSV460</strong>
            <P>106 tickets . VIP</P>
        </div>
        <span class="status-pill">Active</span>
        </li>

        <li class="ticket-row">
            <span class="ticket-icon"><i class="bi bi-ticket-detailed"></i></span>
            <div class="ticket-info"><strong class="ticket-code">CSV480</strong>
            <P>119 tickets . VVIP</P>
        </div>
        <span class="status-pill">Active</span>
        </li>

    </ul>


    </main>

<script src="js/main.js"></script>
</body>
</html>
