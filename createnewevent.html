<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventify-Create New Event</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <header class="page-header">
    <a href="organizer.html" class="back-link" aria-label="Go back">&#8249;</a>
    <h1>Create New Event</h1>
    </header>

    <div class="tabs">
    <button type="button" class="tab active">Details</button>
    <button type="button" class="tab">Staff</button>
    <button type="button" class="tab">Ticket</button>
    </div>

    <main>
    <h2 class="section-title"> <i class="bi bi-ticket-perforated-fill"></i>   Event Information</h2>

    <form action="event-details.html" class="event-form">
        <label for="event-name">Event Name</label>
        <input type="text" id="event-name" placeholder="Tech &amp; Creators Summit 2026">

        <div class="row">
        <div>
            <label for="event-date">Date</label>
        <input type="date" id="event-date">
        </div>

        <div>
            <label for="event-time">Time</label>
        <input type="time" id="event-time">
        </div>
        </div>

        <label for="event-location">Event Location</label>
        <input type="text" id="event-location" placeholder="Eko Conventional Center, V.I, Lagos">

        <label for="event-about">About Event</label>
        <textarea id="event-about" rows="1" placeholder="Tell us about your event"></textarea>

        <input type="file" id="event-image" accept="image/*" hidden>
        <label for="event-image" class="btn-outline">Upload image</label>

        <button type="submit" class="btn-primary">Next</button>
        <a href="createnewevent.html" class="cancel-link">Cancel</a>

    </form>
    </main>
<script src="js/main.js"></script>
</body>
</html>
